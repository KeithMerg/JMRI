# This workflow will build a Java project with Maven-Ant then run individually-flagged tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Run Separate Tests

on: [ push, pull_request ]
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]

# One run per pull request: a new push to a PR cancels that PR's older run, so a superseded run
# doesn't wait for one of the scarce macOS runners. Push runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    # Pull requests run on an Intel macOS runner: GitHub's Apple-silicon (arm64) pool behind macos-15 is often
    # short of capacity, and jobs then fail without running ("The job was not acquired by Runner of type
    # hosted"). Pushes, including every master commit, still run on Apple silicon, which current Macs use.
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-15-intel' || 'macos-15' }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 11
        # problem-matcher=false disable annotations viewing PRs
        problem-matcher: false
    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Build and Run
      run: |
        # compile code and tests
        mvn antrun:run -Danttarget=tests
        # run individual tests
        ./scripts/run_flagged_tests_separately
    - name: Check Line Ends
      run: |
        # reuses previous compile and tests targets
        ant checklineends
